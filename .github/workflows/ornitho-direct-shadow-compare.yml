name: Ornitho Direct Shadow Compare

on:
  workflow_dispatch:
    inputs:
      categories:
        description: "Comma-separated direct HTTP category filters"
        required: true
        default: "rare"
        type: string
      extra_targets:
        description: "Comma-separated shadow-only targets such as SH-HEI"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show run context
        run: |
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Categories: ${{ inputs.categories }}"
          echo "Extra shadow-only targets: ${{ inputs.extra_targets }}"
          echo "Berlin time: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright and browser dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Create output directory
        run: mkdir -p output/direct-shadow-compare

      - name: Run direct shadow comparison
        run: |
          echo "Python command: xvfb-run python -m ornitho.direct_shadow_run --categories '${{ inputs.categories }}' --extra-targets '${{ inputs.extra_targets }}' --playwright-attempts 2 --playwright-wait-seconds 5"
          xvfb-run python -m ornitho.direct_shadow_run --categories "${{ inputs.categories }}" --extra-targets "${{ inputs.extra_targets }}" --playwright-attempts 2 --playwright-wait-seconds 5

      - name: Show comparison summary
        if: always()
        run: |
          if [ -f output/direct-shadow-compare/comparison_report.txt ]; then
            cat output/direct-shadow-compare/comparison_report.txt
          else
            echo "Comparison report was not created."
          fi

      - name: Upload direct shadow comparison artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ornitho-direct-shadow-compare
          path: |
            output/direct-shadow-compare/
            output/*_last_page.html
            output/*_last_page_text.txt
