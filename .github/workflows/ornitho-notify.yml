name: Ornitho Hourly Notifications

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scrape and print notification emails without sending them"
        required: true
        default: "true"
        type: boolean

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: ornitho-monitor-state
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show run context
        run: |
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Berlin time: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright and browser dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Create output directory
        run: mkdir -p output state

      - name: Show state status
        run: |
          if [ -f state/state.json ]; then
            echo "State file present."
          else
            echo "State file missing."
          fi

      - name: Run Ornitho notification monitor
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'False' }}
        run: |
          echo "dry_run=${DRY_RUN}"
          echo "Python command: xvfb-run python -m ornitho.main --mode notify"
          python - <<'PY'
          import os
          print(f"EMAIL_FROM configured: {bool(os.environ.get('EMAIL_FROM'))}")
          print(f"EMAIL_TO configured: {bool(os.environ.get('EMAIL_TO'))}")
          print(f"EMAIL_PASSWORD configured: {bool(os.environ.get('EMAIL_PASSWORD'))}")
          PY
          xvfb-run python -m ornitho.main --mode notify

      - name: Commit updated state
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        run: |
          if git diff --quiet -- state/state.json; then
            echo "State unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "Update Ornitho state"
          git push

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ornitho-notify-report
          path: output/
